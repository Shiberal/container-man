[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "container-man"
version = "0.1.0"
description = "Docker-focused container and volume manager"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "container-man" }]
dependencies = []

[project.scripts]
cm = "container_man.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
